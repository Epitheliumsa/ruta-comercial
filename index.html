<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <meta name="theme-color" content="#006b4f">
    <title>Ruta Comercial Epithelium</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="visitas.css">

    <!-- Ícono y ajustes para instalar la app en la pantalla de inicio -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ruta Comercial">
</head>
<body>
    <div id="app">
        <!-- LOGIN -->
        <div id="loginScreen" class="screen active">
            <div class="login-container">
                <div class="logo-login">
                    <img src="logo.png" alt="Epithelium Logo">
                </div>
                <h1>Ruta Comercial</h1>
                <p>Ingresa tu usuario y clave</p>
                <input type="text" id="accessUser" placeholder="Usuario" maxlength="40" autocapitalize="none" autocomplete="username" onkeydown="if(event.key==='Enter')ingresar()">
                <input type="password" id="accessCode" placeholder="Clave" maxlength="30" autocomplete="current-password" onkeydown="if(event.key==='Enter')ingresar()">
                <button onclick="ingresar()">Acceder</button>
                <p id="errorMsg" class="error"></p>
            </div>
        </div>

        <!-- INICIO -->
        <div id="homeScreen" class="screen app-screen">
            <div class="header">
                <div class="header-logo">
                    <img src="logo-blanco.png" alt="Epithelium" class="header-logo-img">
                    <h1>Ruta Comercial</h1>
                </div>
                <button class="logout-btn" onclick="cerrarSesion()">Salir</button>
            </div>

            <div class="home-menu">
                <p class="home-intro" id="homeIntro"></p>
                <button class="home-btn" onclick="abrirAgenda()">
                    <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="10" width="34" height="31" rx="3"/><path d="M7 19h34M16 6v8M32 6v8"/><path d="M16 28l4 4 8-8"/></svg>
                    <span class="home-btn-text"><strong>Agenda de visitas</strong><small id="homeAgendaTxt">Programa y registra tus visitas del día</small></span>
                </button>
                <button class="home-btn home-btn-act" onclick="abrirActividades()">
                    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M17 12h22M17 24h22M17 36h22"/><path d="M6 11l3 3 5-5M6 23l3 3 5-5"/><rect x="6" y="33" width="7" height="7" rx="1.5"/></svg>
                    <span class="home-btn-text"><strong>Actividades del mes</strong><small id="homeActTxt">Lo que tienes programado este mes</small></span>
                </button>
                <button class="home-btn home-btn-panel" id="btnPanel" onclick="abrirPanel()" style="display:none">
                    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 41h34"/><rect x="10" y="24" width="7" height="13" rx="1.5"/><rect x="21" y="14" width="7" height="23" rx="1.5"/><rect x="32" y="19" width="7" height="18" rx="1.5"/></svg>
                    <span class="home-btn-text"><strong>Panel del equipo</strong><small>Cumplimiento de visitas y actividades por vendedor</small></span>
                </button>
                <button class="home-btn home-btn-desc" onclick="abrirDescarga()">
                    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 6h17l9 9v27H12z"/><path d="M29 6v9h9"/><path d="M25 21v13M19.5 28.5L25 34l5.5-5.5"/></svg>
                    <span class="home-btn-text"><strong>Descargar informe</strong><small>Excel con visitas y actividades del mes</small></span>
                </button>
                <p class="estado-sync" id="estadoSync"></p>
            </div>
        </div>

        <!-- AGENDA -->
        <div id="agendaScreen" class="screen app-screen">
            <div class="header">
                <div class="header-logo">
                    <img src="logo-blanco.png" alt="Epithelium" class="header-logo-img">
                    <h1>Agenda</h1>
                </div>
                <button class="logout-btn" onclick="irInicio()">&larr; Inicio</button>
            </div>

            <div class="filters filtros-rc">
                <select id="agVendedor" class="solo-jefe" onchange="cambiarVendedorAgenda()"></select>
                <div class="nav-fecha">
                    <button class="btn-nav" onclick="moverDia(-1)" aria-label="Día anterior">&lsaquo;</button>
                    <div class="nav-titulo"><strong id="agFechaTxt"></strong><small id="agFechaSub"></small></div>
                    <button class="btn-nav" onclick="moverDia(1)" aria-label="Día siguiente">&rsaquo;</button>
                </div>
                <div class="semana" id="agSemana"></div>
                <div class="fila-botones">
                    <button class="btn-nuevo" onclick="irHoy()">Hoy</button>
                    <input type="date" id="agFechaPick" onchange="elegirFecha(this.value)" aria-label="Elegir fecha">
                    <button class="btn-nuevo active" onclick="abrirProgramar()">+ Programar visita</button>
                </div>
            </div>

            <div class="resumen-dia" id="agResumen"></div>
            <div id="agLista" class="resultados"></div>
        </div>

        <!-- ACTIVIDADES DEL MES -->
        <div id="actScreen" class="screen app-screen tema-azul">
            <div class="header">
                <div class="header-logo">
                    <img src="logo-blanco.png" alt="Epithelium" class="header-logo-img">
                    <h1>Actividades del mes</h1>
                </div>
                <button class="logout-btn" onclick="irInicio()">&larr; Inicio</button>
            </div>

            <div class="filters filtros-rc">
                <select id="actVendedor" class="solo-jefe" onchange="pintarActividades()"></select>
                <div class="nav-fecha">
                    <button class="btn-nav" onclick="moverMesAct(-1)" aria-label="Mes anterior">&lsaquo;</button>
                    <div class="nav-titulo"><strong id="actMesTxt"></strong><small id="actMesSub"></small></div>
                    <button class="btn-nav" onclick="moverMesAct(1)" aria-label="Mes siguiente">&rsaquo;</button>
                </div>
                <div class="progreso"><span class="barra"><i id="actBarra"></i></span><b id="actPct"></b></div>
                <div class="fila-botones">
                    <button class="btn-nuevo active" onclick="abrirActividad()">+ Nueva actividad</button>
                </div>
            </div>

            <div id="actLista" class="resultados"></div>
        </div>

        <!-- PANEL DEL EQUIPO -->
        <div id="panelScreen" class="screen app-screen">
            <div class="header">
                <div class="header-logo">
                    <img src="logo-blanco.png" alt="Epithelium" class="header-logo-img">
                    <h1>Panel del equipo</h1>
                </div>
                <button class="logout-btn" onclick="irInicio()">&larr; Inicio</button>
            </div>

            <div class="filters filtros-rc">
                <div class="nav-fecha">
                    <button class="btn-nav" onclick="moverMesPanel(-1)" aria-label="Mes anterior">&lsaquo;</button>
                    <div class="nav-titulo"><strong id="panMesTxt"></strong><small id="panMesSub"></small></div>
                    <button class="btn-nav" onclick="moverMesPanel(1)" aria-label="Mes siguiente">&rsaquo;</button>
                </div>
            </div>

            <div class="panel-cuerpo">
                <div class="kpis" id="panKpis"></div>
                <div class="panel-bloque">
                    <h2>Por vendedor</h2>
                    <div class="tabla-w"><table id="panTabla"></table></div>
                </div>
                <div class="panel-bloque">
                    <h2>Motivos de no visita</h2>
                    <div id="panMotivos"></div>
                </div>
            </div>
        </div>

        <!-- MODAL (formularios) -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="cerrarModal()">&times;</span>
                <div id="modalContenido"></div>
            </div>
        </div>
        <div id="toast" class="toast"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
