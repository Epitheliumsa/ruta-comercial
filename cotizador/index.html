/* Misma identidad de Visita Comercial (tema claro fijo). Layout: fórmula a la izquierda, etiqueta con precio a la derecha; apilado en celular */
:root{ color-scheme: light only;
  --verde:#006b4f; --verde2:#00A651; --verde-suave:#e6f4ec; --tinta:#1f2937; --gris:#5f6b68; --linea:#d9e5df; --blanco:#fff;
  --ok:#0a6647; --ok-suave:#e3f3ea; --mal:#b42318; --mal-suave:#fce8e6; --aviso:#9a5b00; --aviso-suave:#fdf2dd;
  --papel:#fffdf6; --papel-linea:#e7dfc7; }
body{background:#f5f5f5;color:var(--tinta)}
.cz{width:100%;max-width:1180px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.cz{grid-template-columns:minmax(0,1fr)}}
.motor-sel{display:inline-flex;background:rgba(255,255,255,.18);border-radius:999px;padding:3px;gap:2px}
.motor-sel button{border:0;background:transparent;color:#fff;font:700 13px inherit;font-family:inherit;padding:7px 14px;border-radius:999px;cursor:pointer}
.motor-sel button[aria-pressed="true"]{background:#fff;color:var(--verde)}
.tarjeta{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0;box-shadow:0 2px 10px rgba(0,80,50,.06)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-h h2{font-size:16px;color:var(--verde);margin:0}
.sec-h span{font-size:12px;color:var(--gris)}
.fila{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
label.campo{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--gris);min-width:0}
.cz input,.cz select{font:500 15px inherit;font-family:inherit;color:var(--tinta)!important;background:#fff!important;border:2px solid #dde5e1;border-radius:9px;padding:9px 10px;width:100%;min-width:0}
.cz input:focus,.cz select:focus,.cz button:focus-visible{outline:none;border-color:var(--verde2);box-shadow:0 0 0 3px rgba(0,166,81,.15)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.acts{display:flex;flex-direction:column;gap:8px}
.act{display:grid;grid-template-columns:minmax(0,1fr) 96px 38px;gap:8px;align-items:start}
.who{position:relative;min-width:0}
.meta{font-size:12px;color:var(--gris);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cod{font:600 11.5px ui-monospace,Menlo,monospace;background:var(--verde-suave);color:var(--verde);padding:1px 6px;border-radius:4px}
.nota{font-size:12px;color:var(--aviso)}
.pct{position:relative}.pct input{padding-right:26px}.pct::after{content:"%";position:absolute;right:10px;top:11px;color:var(--gris);font-size:14px}
.quitar{width:38px;height:42px;border:2px solid #dde5e1;background:#fff;color:var(--gris);border-radius:9px;cursor:pointer;font-size:18px}

.sug{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--linea);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.14);max-height:260px;overflow:auto;padding:4px}

.sec-h h2.falta{color:var(--mal)}
.precio .vacio-txt{display:block;color:var(--gris);font-size:13px;margin-top:4px}

.f-quitar{background:none;border:0;color:var(--mal);font:600 13px inherit;font-family:inherit;cursor:pointer;padding:4px 6px}

@media (max-width:520px){.fila-forma{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.fila-forma .campo-cant{grid-column:1/-1;max-width:120px}}

.tel-sac{color:inherit;text-decoration:none;white-space:nowrap}
.aviso-catalogo{display:block;margin-top:4px;padding:7px 10px;border-radius:8px;background:var(--mal-suave);border:1px solid #f5c2bc;color:var(--mal);font-size:13px;font-weight:600;line-height:1.4}

<div id="app">
  <!-- INGRESO -->
  <div id="loginScreen" class="screen active">

      <p>Ingresa tu usuario y clave</p>
      <input type="text" id="accessUser" placeholder="Usuario" maxlength="40" autocapitalize="none" autocomplete="username" onkeydown="if(event.key==='Enter')ingresar()">
      <input type="password" id="accessCode" placeholder="Clave" maxlength="30" autocomplete="current-password" onkeydown="if(event.key==='Enter')ingresar()">

      <p class="ayuda-ios" id="ayudaIos" hidden>En iPhone o iPad: toca Compartir y luego «Agregar a inicio».</p>
    </div>
  </div>

  <div id="appScreen" class="screen app-screen">
    <div class="header">
      <div class="header-logo">
        <img src="../logo-blanco.png" alt="Epithelium" class="header-logo-img">
        <h1>Cotizador Epithelium <span class="en-pruebas-cz">EN PRUEBAS</span></h1>
      </div>
      <div class="cab-der">
        <div class="motor-sel" role="group" aria-label="Motor de precios">

            <label class="campo">Paciente *<input id="paciente" autocomplete="off" placeholder="Nombre del paciente"></label>
            <label class="campo">PDV<input id="pdv" readonly tabindex="-1" class="solo-lectura"></label>
          </div>
        </section>
        <div id="formulas" class="formulas"></div>
        <button type="button" class="agregar nueva-formula" id="addFormula">+ Nueva fórmula</button>
        <section id="secChecks" hidden>
          <div class="sec-h"><h2 class="falta">Falta completar</h2></div>
          <div class="checks" id="checks"></div>

        <div class="btns">

          <button type="button" class="btn-pri" id="copy-odoo" disabled>Copiar línea Odoo</button>
          <button type="button" class="btn-sec" id="btnPdf" disabled>Descargar PDF</button>
        </div>
        <div class="toast-cz" id="toast-cz"></div>
        <div id="linea-box" hidden><div class="linea-odoo" id="linea"></div></div>

      <p class="carga" id="carga" hidden>Cargando el motor de cotización…</p>
      <div class="pie"><p id="pie"></p><div class="admin-motor" id="adminMotor" hidden><button type="button" class="btn-sec" onclick="document.getElementById('motorArchivo').click()">Cargar motor (archivo JSON)</button><input type="file" id="motorArchivo" accept=".json,application/json" hidden onchange="subirMotor(this)"><span id="adminMsg"></span></div></div>
    </div>

<script src="usuarios.js?v=202611062354" charset="utf-8"></script>
<script>
/* ===== Cotizador Epithelium: ingreso con los mismos usuarios y claves de Visita Comercial =====
   El motor (costos, márgenes) NO está en el repositorio: se trae del servidor de Visita Comercial
   (base privada "motor_cotizador", solo con usuario y clave válidos) y queda guardado en el equipo. */
const API_URL = 'https://script.google.com/macros/s/AKfycbwji7WhPpF2VhCRQETWXNFhF2PTAL8JP8z9SW-stsKdnjbyBa-KVucGCvm6seoTFLfl3Q/exec';
const SESION_KEY = 'cz_sesion', MOTOR_KEY = 'cz_motor';
const $id = id => document.getElementById(id);
let sesion = null, cotizadorListo = false;

async function huellaDe(u, c) { const b = new TextEncoder().encode(`${u.toLowerCase()}:${c.toLowerCase()}`); return [...new Uint8Array(await crypto.subtle.digest('SHA-256', b))].map(x => x.toString(16).padStart(2, '0')).join(''); }
const leer = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
const escribir = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
function pantalla(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); }
function cargarScript(src) { return new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.charset = 'utf-8'; s.onload = ok; s.onerror = mal; document.body.appendChild(s); }); }

async function api(cuerpo) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...cuerpo, usuario: sesion.usuario, clave: sesion.clave }) });
  const d = await r.json().catch(() => { throw new Error('el servidor no respondió bien'); });
  if (!d.ok) throw new Error(d.error || 'Error del servidor');
  return d;
}
// Trae el motor del servidor si hay una versión nueva; sin conexión usa el guardado en el equipo
async function traerMotor() {
  let cache = leer(MOTOR_KEY);
  try {
    const { actualizado } = await api({ accion: 'motorCotizador', soloVersion: true });
    if (actualizado && (!cache || cache.v !== actualizado)) {
      const r = await api({ accion: 'motorCotizador' });
      if (r.contenido) { cache = { v: r.actualizado || actualizado, d: JSON.parse(r.contenido) }; escribir(MOTOR_KEY, cache); }
    }
  } catch (e) { console.warn('Sin conexión con el servidor, uso el motor guardado:', e); }
  return cache && cache.d;
}

async function entrar(u, clave) {
  sesion = { ...u, clave };
  escribir(SESION_KEY, { usuario: u.usuario, clave });
  $id('czUsuario').textContent = u.empresa ? u.nombre : '';
  window.CZ_COTIZA = u.empresa ? u.nombre : '';
  window.CZ_PDV = u.nombre;   // PDV: el cliente o, para el personal de Epithelium, el empleado que cotiza
  $id('adminMotor').hidden = !u.admin;
  pantalla('appScreen');
  document.querySelectorAll('#form, .lado').forEach(e => e.hidden = true);
  $id('carga').hidden = false; $id('carga').textContent = 'Cargando el motor de cotización…';
  const d = await traerMotor();
  if (!d) {
    $id('carga').textContent = u.admin ? 'Todavía no hay motor cargado en el servidor. Súbelo con «Cargar motor» aquí abajo.' : 'Todavía no hay motor cargado. Avísale al administrador.';
    return;
  }
  window.MOTOR = d;
  window.CZ_MOTORES = u.motores || ['EPITHELIUM', 'CDFLL'];   // usuarios propios: solo sus motores
  $id('carga').hidden = true;
  document.querySelectorAll('#form, .lado').forEach(e => e.hidden = false);
  if (!cotizadorListo) { cotizadorListo = true; await cargarScript('cotizador.js?v=202611062354'); }
}

async function ingresar() {
  const usuario = $id('accessUser').value.trim(), clave = $id('accessCode').value.trim(), err = $id('errorMsg');
  if (!usuario || !clave) { err.textContent = 'Ingresa tu usuario y clave'; return; }
  const u = USUARIOS.find(x => x.usuario.toLowerCase() === usuario.toLowerCase());
  if (!u || u.huella !== await huellaDe(usuario, clave)) { err.textContent = 'Usuario o clave incorrectos'; $id('accessCode').value = ''; return; }
  if (!tieneAcceso(u)) { err.textContent = 'El cotizador está en pruebas. Pronto tendrás acceso.'; $id('accessCode').value = ''; return; }
  err.textContent = ''; $id('accessCode').value = '';
  try { localStorage.removeItem('cz_salio'); } catch (e) {}
  entrar(u, clave);
}
function salir() { try { localStorage.removeItem(SESION_KEY); localStorage.removeItem(MOTOR_KEY); localStorage.setItem('cz_salio', '1'); } catch (e) {} location.reload(); }

// Administrador: sube el motor (archivo JSON que se genera desde los Excel del motor)
async function subirMotor(input) {
  const f = input.files[0]; input.value = ''; if (!f) return;
  const msg = $id('adminMsg');
  try {
    const texto = await f.text(), d = JSON.parse(texto);
    if (!d.materias || !d.combos || !d.formas || !d.rangos_cdfll) throw new Error('el archivo no es un motor del cotizador');
    msg.textContent = `Subiendo motor ${d.version}…`;
    await api({ accion: 'guardarBase', nombre: 'motor_cotizador', contenido: texto, resumen: `Motor ${d.version} · ${d.materias.length} activos · ${d.formas.length} presentaciones` });
    try { localStorage.removeItem(MOTOR_KEY); } catch (e) {}
    msg.textContent = `Motor ${d.version} cargado. Todos lo reciben al abrir el cotizador.`;
    setTimeout(() => location.reload(), 1500);
  } catch (e) { msg.textContent = 'No se pudo cargar: ' + e.message; }
}

// Instalar como app (computador, tablet y celular)
let avisoInstalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); avisoInstalar = e; $id('btnInstalar').classList.add('si'); });
async function instalarApp() { if (!avisoInstalar) return; avisoInstalar.prompt(); await avisoInstalar.userChoice; avisoInstalar = null; $id('btnInstalar').classList.remove('si'); }
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !navigator.standalone) $id('ayudaIos').hidden = false;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// Sesión: la propia del cotizador o, para el personal de la empresa, la de Visita Comercial (mismo sitio, mismo usuario)
(async function () {
  const propia = leer(SESION_KEY), visita = leer('cz_salio') ? null : leer('rc_sesion');   // tras «Salir» no se entra con la de Visita
  const s = propia || visita;
  const u = s && s.usuario && s.clave && USUARIOS.find(x => x.usuario.toLowerCase() === String(s.usuario).toLowerCase());
  const valida = u && (s === propia || u.empresa) && u.huella === await huellaDe(s.usuario, s.clave);
  if (valida && tieneAcceso(u)) entrar(u, s.clave);
  else { if (valida) { try { localStorage.removeItem(SESION_KEY); localStorage.removeItem(MOTOR_KEY); } catch (e) {} $id('errorMsg').textContent = 'El cotizador está en pruebas. Pronto tendrás acceso.'; } pantalla('loginScreen'); }
})();
</script>
